# SPDX-License-Identifier: Apache-2.0
# Build dependency-free release binaries per platform and attach them to the GitHub release,
# so `brew install` (and direct downloads) never need the Rust toolchain.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # A release is the moment the two halves are supposed to line up: the tag
  # publishes binaries, and the marketplaces serve the manifests from the same
  # commit. If they disagree, users get a plugin and a binary that were never
  # tested together - so refuse to publish rather than ship the mismatch.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/version-check.py
      - name: Tag must match the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate="v$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')"
          echo "tag=$tag crate=$crate"
          [ "$tag" = "$crate" ] || { echo "::error::tag $tag != crate $crate"; exit 1; }

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p weir-cli
      - name: Package + checksum
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="weir-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "$name"
          cp "$bin/weir" "$name/"
          strip "$name/weir" || true
          tar -czf "${name}.tar.gz" -C "$name" weir
          shasum -a 256 "${name}.tar.gz" | tee "${name}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            weir-*.tar.gz
            weir-*.tar.gz.sha256
