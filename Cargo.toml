# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/weir-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aquifer-labs/weir"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = "=1.0.104"
walkdir = "=2.5.0"
toml = "=1.1.4"
